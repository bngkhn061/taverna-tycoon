# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.3.0
  last_upgraded: 2026-11-09

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so the rigor `/start` infers
# and saves would stop changing anything. `/start` states the same rule for the
# settings it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/project-settings --local <key>=<value>` writes there; `/project-settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

# Taverna Tycoon: Unity projesi kökte değil, Unity/TavernaTycoon altında.
# Written by /setup-engine unity 6000.6 on 2026-11-09 (installed editor: 6000.6.8f1).
engine:
  name: "Unity"
  version: "6000.6.8f1"
  language: "C#"
  rendering: "URP"
  physics: "PhysX"
  path: "C:/Program Files/Unity/Hub/Editor/6000.6.8f1/Editor/Unity.exe"
  code_root: Unity/TavernaTycoon/Assets
  test_root: Unity/TavernaTycoon/Assets

specialists:
  code: "unity-specialist"
  shader: "unity-shader-specialist"
  ui: "unity-ui-specialist"
  additional: ["unity-dots-specialist", "unity-addressables-specialist"]

naming:
  classes: PascalCase
  variables: camelCase
  constants: SCREAMING_SNAKE   # UNVERIFIED — not sourceable from
                               # docs/engine-reference/unity/; confirm before relying on it
  signals: PascalCase On<Event>
  files: PascalCase
  scenes: PascalCase

# Commands run from the repo root; the Unity project is Unity/TavernaTycoon.
# build uses the project's own verified build method (Windows dev build →
# Unity/Builds/Windows/TavernaTycoon.exe). Android: TavernaBuild.AndroidDev (untested).
commands:
  build: '"C:/Program Files/Unity/Hub/Editor/6000.6.8f1/Editor/Unity.exe" -batchmode -quit -projectPath Unity/TavernaTycoon -executeMethod Taverna.EditorTools.TavernaBuild.WindowsDev -logFile -'
  test: '"C:/Program Files/Unity/Hub/Editor/6000.6.8f1/Editor/Unity.exe" -batchmode -runTests -projectPath Unity/TavernaTycoon -testPlatform EditMode -testResults test-results/editmode.xml'
  run: "Unity/Builds/Windows/TavernaTycoon.exe -screen-width 1266 -screen-height 585 -screen-fullscreen 0"
  smoke: '"C:/Program Files/Unity/Hub/Editor/6000.6.8f1/Editor/Unity.exe" -batchmode -quit -projectPath Unity/TavernaTycoon -logFile -'

testing:
  framework: unity-test-framework

performance:
  target_framerate: 60
  frame_budget_ms: 16.6
  draw_call_limit: 150
  memory_ceiling_mb: 1024
